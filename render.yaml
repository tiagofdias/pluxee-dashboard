services:
  - type: web
    name: pluxee-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: RENDER
        value: "true"
      - key: POLL_INTERVAL_SECONDS
        value: "60"
      - key: PLUXEE_API_CLAIM
        sync: false  # Set manually in Render dashboard
      - key: PLUXEE_CARD_ID
        value: "bHnxCGNGTfJEdgXDz4paOPlcAr6fOsEDgIgkE84nDT8%3DslEA7yYOHkT0tOM3"
      - key: PLUXEE_BENEFIT_ID
        value: "Fjzuh5HrgzFxK%2FWm9BXIAQ%3D%3DX0kllae3G4hK4L3I"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CRON_SECRET
        generateValue: true  # Auto-generate a random secret for cron protection
    healthCheckPath: /ping
