services:
  - type: web
    name: pluxee-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PLUXEE_API_CLAIM
        sync: false  # Set manually in Render dashboard
      - key: PLUXEE_CARD_ID
        value: "bHnxCGNGTfJEdgXDz4paOPlcAr6fOsEDgIgkE84nDT8%3DslEA7yYOHkT0tOM3"
      - key: PLUXEE_BENEFIT_ID
        value: "Fjzuh5HrgzFxK%2FWm9BXIAQ%3D%3DX0kllae3G4hK4L3I"
      - key: NTFY_TOPIC
        value: pluxee-tiago-a7x9k2
      - key: CRON_SECRET
        generateValue: true  # Auto-generate a random secret for cron protection
    healthCheckPath: /ping
