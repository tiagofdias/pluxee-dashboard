services:
  - type: web
    name: pluxee-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: RENDER
        value: "true"
      - key: POLL_INTERVAL_SECONDS
        value: "60"
      - key: KEEPALIVE_MODE
        value: "smart"
      - key: PLUXEE_API_CLAIM
        sync: false # Set manually in Render dashboard
      - key: PLUXEE_CARD_ID
        sync: false
      - key: PLUXEE_BENEFIT_ID
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true # Auto-generate a random secret for cron protection
      - key: APP_ORIGIN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
    healthCheckPath: /ping
