<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pluxee — Saldo em Tempo Real</title>
  <meta name="description" content="Consulte o saldo do seu cartão Pluxee (Sodexo) Lunch Pass em tempo real." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Noise texture overlay -->
  <div class="noise-overlay"></div>

  <!-- Ambient glow orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <main id="app">

    <!-- ====== HEADER ====== -->
    <header class="app-header" id="app-header">
      <div class="header-left">
        <div class="brand-mark">
          <span class="brand-dot"></span>
          <span class="brand-dot dot-sm"></span>
        </div>
        <span class="brand-wordmark">Pluxee</span>
      </div>
      <div class="header-right">
        <div class="live-indicator" id="live-indicator">
          <span class="live-dot"></span>
          <span class="live-label">Em tempo real</span>
        </div>
      </div>
    </header>

    <!-- ====== BALANCE HERO CARD ====== -->
    <section class="hero-card" id="hero-card">
      <div class="hero-card-glow"></div>
      <div class="hero-card-inner">
        <div class="hero-top">
          <div class="hero-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
            <span>Lunch Pass</span>
          </div>
          <p class="hero-updated" id="hero-updated">A carregar...</p>
        </div>
        <div class="hero-balance-row">
          <p class="hero-amount" id="hero-amount">€0,00</p>
          <div class="hero-amount-shimmer" id="hero-shimmer"></div>
        </div>
        <div class="hero-bar-track">
          <div class="hero-bar-fill" id="hero-bar-fill"></div>
        </div>
      </div>
    </section>

    <!-- ====== QUICK STATS ROW ====== -->
    <section class="stats-row" id="stats-row">
      <div class="stat-chip" id="stat-last-spend">
        <div class="stat-chip-icon negative">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
        </div>
        <div class="stat-chip-text">
          <span class="stat-chip-label">Último gasto</span>
          <span class="stat-chip-value" id="stat-last-spend-val">—</span>
        </div>
      </div>
      <div class="stat-chip" id="stat-tx-count">
        <div class="stat-chip-icon neutral">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        <div class="stat-chip-text">
          <span class="stat-chip-label">Movimentos</span>
          <span class="stat-chip-value" id="stat-tx-count-val">0</span>
        </div>
      </div>
      <div class="stat-chip" id="stat-daily-avg">
        <div class="stat-chip-icon positive">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="stat-chip-text">
          <span class="stat-chip-label">Média diária</span>
          <span class="stat-chip-value" id="stat-daily-avg-val">—</span>
        </div>
      </div>
    </section>

    <!-- ====== TRANSACTIONS ====== -->
    <section class="tx-section" id="tx-section">
      <div class="tx-header">
        <h2 class="tx-title">Últimos Movimentos</h2>
        <span class="tx-count-badge" id="tx-count">0</span>
      </div>
      <div class="tx-list" id="tx-list">
        <div class="tx-empty" id="tx-empty">
          <div class="tx-empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </div>
          <p>A carregar movimentos...</p>
        </div>
      </div>
    </section>

    <!-- ====== ERROR TOAST ====== -->
    <div id="error-toast" class="error-toast hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
      <span id="error-text"></span>
      <button class="error-dismiss" id="error-dismiss" aria-label="Dismiss">×</button>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
