name: Private Monitor and Public Demo
on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: pluxee-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' && vars.ENABLE_PRIVATE_MONITOR == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check transactions using private cloud state
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DASHBOARD_OWNER_ID: ${{ secrets.DASHBOARD_OWNER_ID }}
          PLUXEE_API_CLAIM: ${{ secrets.PLUXEE_API_CLAIM }}
          PLUXEE_CARD_ID: ${{ secrets.PLUXEE_CARD_ID }}
          PLUXEE_BENEFIT_ID: ${{ secrets.PLUXEE_BENEFIT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SECRET_KEY" && test -n "$DASHBOARD_OWNER_ID" || { echo 'Configure private Supabase storage before enabling monitoring.'; exit 1; }
          python monitor.py --once
      # Private state stays in Supabase. Never commit runtime data or upload it as an artifact.
  demo:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build demo from public asset allowlist
        env:
          PRIVATE_APP_URL: ${{ vars.PRIVATE_APP_URL }}
        run: python scripts/build_demo.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
