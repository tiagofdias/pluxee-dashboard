name: Pluxee Monitor & GitHub Pages

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches: [ master ]
    paths-ignore:
      - 'data/**'
      - 'static/data.json'
      - 'README.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pluxee-monitor'
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pluxee Monitor (Check & Notify)
        env:
          PLUXEE_API_CLAIM: ${{ secrets.PLUXEE_API_CLAIM }}
          PLUXEE_CARD_ID: ${{ secrets.PLUXEE_CARD_ID }}
          PLUXEE_BENEFIT_ID: ${{ secrets.PLUXEE_BENEFIT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py --once

      - name: Commit updated state to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/transactions.json static/data.json || git add static/data.json || true
          git diff --staged --quiet || (git commit -m "chore: update transaction state [skip ci]" && git push) || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp -r static/* _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
